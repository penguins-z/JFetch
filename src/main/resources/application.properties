spring.application.name=JFetch

# Secrets live in ./.env (gitignored), read as KEY=value lines. A real environment variable with the same
# name still wins over the file.
spring.config.import=optional:file:.env[.properties]

# Local file-based H2: cache of fetched jobs + status tracking. Survives restarts.
spring.datasource.url=jdbc:h2:file:./data/jfetch
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
# Cookie-only sessions (flash messages); avoids ;jsessionid= in redirect URLs.
server.servlet.session.tracking-modes=cookie

# JSearch (OpenWeb Ninja) via RapidAPI. Key comes from the RAPIDAPI_KEY env var only.
jsearch.api-key=${RAPIDAPI_KEY:}
jsearch.host=jsearch.p.rapidapi.com
jsearch.base-url=https://jsearch.p.rapidapi.com
# JSearch renamed /search to /search-v2 (cursor pagination, data: {jobs, cursor}).
jsearch.search-path=/search-v2
jsearch.max-pages=10
# Each page is one API call and one billed request. A search fetches pages until it has
# (pages x 10) jobs not already in the DB; this caps how many pages that may take.
jsearch.max-scan-pages=15
jsearch.timeout=30s

jfetch.page-size=10
